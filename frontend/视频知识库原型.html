<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视知 VIDEOKB · 视频知识库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M11 7v18l13-9z' fill='%2317d1ff'/%3E%3C/svg%3E">
<style>
/* ===== 极简 · Attu 绿 + 白，只保留添加视频 / 问答两个核心区 ===== */
:root{
  --bg:#f5f6f7; --sidebar:#ffffff; --panel:#ffffff; --panel-2:#f2f3f5;
  --line:#e8eaed; --line-strong:#d6d9dd;
  --ink:#1d2129; --ink-2:#4e5969; --ink-3:#86909c;
  --green:#17d1ff; --green-hover:#0fc0ee; --green-dim:rgba(23,209,255,.12); --green-line:rgba(23,209,255,.4);
  --radius:12px; --radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Display","SF Pro Text","Microsoft YaHei",sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}

.app{display:flex;min-height:100vh}
/* ===== 侧栏：只放 logo + 两个入口 ===== */
.sidebar{width:200px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:1.4rem 1rem}
.brand{display:flex;align-items:center;gap:.6rem;padding:.3rem .4rem 1.4rem}
.brand .mark{width:32px;height:32px;flex:none;color:var(--green);display:grid;place-items:center}
.brand .mark svg{width:17px;height:17px}
.brand .t{font-weight:800;font-size:1.08rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .75rem;border-radius:var(--radius-sm);
  color:var(--ink-2);font-size:.94rem;transition:.15s;text-align:left;width:100%}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.75}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.active{color:var(--green);font-weight:600}
.nav-item.active svg{opacity:1}

/* ===== 主区：窄宽居中 ===== */
.main{flex:1;min-width:0;padding:2.2rem 1.6rem;display:flex;justify-content:center}
.wrap{width:100%;max-width:680px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:1.4rem}
.page-head h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.page-head p{color:var(--ink-3);font-size:.9rem;margin-top:.25rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem;box-shadow:var(--shadow)}

/* ===== 分段控件 ===== */
.seg{display:inline-flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:var(--radius-sm);margin-bottom:1.1rem}
.seg button{padding:.45rem 1.1rem;border-radius:6px;font-size:.88rem;color:var(--ink-2);transition:.15s}
.seg button.active{background:var(--panel);color:var(--green);font-weight:600;box-shadow:var(--shadow)}

.field{display:flex;gap:.7rem}
.field input{flex:1;padding:.85rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--panel);
  color:var(--ink);font-size:1rem;outline:none;transition:.15s;min-width:0}
.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
.field input::placeholder{color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.5rem;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;
  color:var(--green);background:transparent;border:1px solid var(--green-line);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--green-dim)}
.drop{margin-top:1rem;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);padding:1.5rem;text-align:center;color:var(--ink-2);
  transition:.15s;cursor:pointer}
.drop:hover{border-color:var(--green-line);color:var(--ink)}
.drop svg{width:24px;height:24px;margin-bottom:.4rem;opacity:.5}
.hint{font-size:.82rem;color:var(--ink-3);margin-top:.7rem}

/* ===== 进度（精简） ===== */
.progress-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem}
.progress-head .name{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-head .pct{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--green)}
.total-bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.total-bar i{display:block;height:100%;width:0;background:var(--green);transition:width .5s ease}
.steps{margin-top:1rem;display:grid;gap:.7rem}
.step{display:flex;align-items:center;gap:.8rem;font-size:.9rem}
.step .dot{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;
  background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
.step .dot svg{width:12px;height:12px;display:none}
.step.running .dot{color:var(--green);border-color:var(--green-line)}
.step.done .dot{background:transparent;color:var(--green);border-color:var(--green)}
.step.done .dot span{display:none}
.step.done .dot svg{display:block}
.step .t{color:var(--ink-2)}
.step .p{margin-left:auto;font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ===== 已导入：极简行列表 ===== */
.list{margin-top:1.4rem}
.list-title{font-size:.9rem;font-weight:700;color:var(--ink-2);margin-bottom:.6rem}
.row{display:flex;align-items:center;gap:.8rem;padding:.8rem .9rem;border-radius:var(--radius-sm);background:var(--panel);
  border:1px solid var(--line);margin-bottom:.55rem}
.row .ic{width:30px;height:30px;flex:none;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;color:var(--green)}
.row .ic svg{width:15px;height:15px}
.row .info{flex:1;min-width:0}
.row .n{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.78rem;color:var(--ink-3)}
.badge{font-size:.72rem;padding:.18rem .55rem;border-radius:99px;font-weight:600;flex:none;color:var(--green);background:transparent}

/* ===== 问答 ===== */
.chat{display:flex;flex-direction:column;gap:1rem;min-height:380px;padding:1.4rem}
.msg{max-width:80%;padding:.85rem 1.1rem;border-radius:14px;font-size:.95rem;line-height:1.7}
.msg.q{align-self:flex-end;background:var(--panel-2);color:var(--ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .who{font-size:.76rem;color:var(--green);margin-bottom:.3rem;font-weight:600}
.msg .ts{display:inline-block;margin:.3rem .25rem 0 0;font-size:.74rem;color:var(--green);background:transparent;padding:.12rem .5rem;border-radius:6px;font-weight:600}
.caret{display:inline-block;width:7px;height:1.05em;background:var(--green);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.chatbar{display:flex;gap:.7rem;align-items:center;margin-top:1rem}
.chatbar textarea{flex:1;resize:none;padding:.9rem 1.1rem;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--panel);
  color:var(--ink);font-size:1rem;outline:none;min-height:50px;transition:.15s}
.chatbar textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
.send{width:44px;height:44px;flex:none;border-radius:50%;background:transparent;color:var(--green);border:1px solid var(--green-line);display:grid;place-items:center;transition:.15s}
.send:hover{background:var(--green-dim)}
.send svg{width:19px;height:19px}
.empty{text-align:center;color:var(--ink-3);padding:3.5rem 0}
.empty svg{width:34px;height:34px;opacity:.35;margin-bottom:.6rem}

.toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:.75rem 1.25rem;border-radius:var(--radius-sm);font-size:.9rem;opacity:0;transition:.3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:1rem}
  .nav{flex-direction:row;overflow-x:auto}
  .nav-item{white-space:nowrap}
  .main{padding:1.2rem 1rem 3rem}
  .field{flex-direction:column}
  .field .btn{justify-content:center}
  .msg{max-width:94%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6.5v11l8.5-5.5z" fill="currentColor"/></svg></span>
      <span class="t">视知</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></svg>
        添加视频
      </button>
      <button class="nav-item" data-view="ask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 01-8 8H5l-2 2V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg>
        智能问答
      </button>
    </nav>
  </aside>

  <main class="main">
    <div class="wrap">

      <!-- ===== 添加视频 ===== -->
      <section id="view-add" class="view on">
        <div class="page-head">
          <h1>添加视频</h1>
          <p>粘贴 B 站链接或上传本地视频，自动解析入库</p>
        </div>

        <div class="panel">
          <div class="seg" id="srcTabs">
            <button class="active" data-src="bili">B 站链接</button>
            <button data-src="local">本地文件</button>
          </div>
          <div class="field">
            <input id="urlInput" type="text" placeholder="粘贴 B 站链接或 BV 号，如 BV1SfpF6GEzC">
            <button class="btn" id="addBtn">解析入库</button>
          </div>
          <div class="drop" id="drop" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
            <div><b>点击选择或拖入视频文件</b><br>支持 mp4 / mov / m4a</div>
          </div>
          <div class="hint" id="srcHint">优先抓取 B 站 CC 字幕；无字幕时自动转语音识别。</div>
        </div>

        <div class="panel" id="progressCard" hidden style="margin-top:1.1rem">
          <div class="progress-head">
            <span class="name" id="pgName">BVxxxxxxx</span>
            <span class="pct" id="pgPct">0%</span>
          </div>
          <div class="total-bar"><i id="pgBar"></i></div>
          <div class="steps" id="steps"></div>
        </div>

        <div class="list" id="listWrap" hidden>
          <div class="list-title">已导入</div>
          <div id="vlist"></div>
        </div>
      </section>

      <!-- ===== 智能问答 ===== -->
      <section id="view-ask" class="view">
        <div class="page-head">
          <h1>智能问答</h1>
          <p>基于已入库视频内容回答</p>
        </div>
        <div class="panel chat" id="chat"></div>
        <div class="chatbar">
          <textarea id="askInput" rows="1" placeholder="输入你的问题…"></textarea>
          <button class="send" id="askBtn" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </section>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
var RAW_VIDEOS = [
  {name:"圣诞vlog1.mp4", src:"本地文件", chunks:2, time:"00:03:10"},
  {name:"BV1SfpF6GEzC · 黑流束海攻略", src:"B站", chunks:10, time:"00:11:00"}
];
var STEP_DEFS = [
  {t:"获取字幕 / 转写"},
  {t:"切分文本"},
  {t:"向量化"},
  {t:"写入索引"}
];
var state = {videos: RAW_VIDEOS.map(function(v){return Object.assign({},v)}), src:"bili", parsing:null, chat:[], asking:false};
var $ = function(id){return document.getElementById(id)};

function go(view){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on')});
  $('view-'+view).classList.add('on');
  document.querySelectorAll('#nav .nav-item').forEach(function(b){
    b.classList.toggle('active', b.dataset.view===view);
  });
}
document.querySelectorAll('#nav .nav-item').forEach(function(b){
  b.addEventListener('click', function(){go(b.dataset.view); history.replaceState(null,'','#/'+b.dataset.view)});
});
function route(){ var h=location.hash.replace('#/',''); go(h==='ask'?'ask':'add'); }
window.addEventListener('hashchange', route);

$('srcTabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  state.src = b.dataset.src;
  document.querySelectorAll('#srcTabs button').forEach(function(x){x.classList.toggle('active',x===b)});
  var isBili = state.src==='bili';
  $('urlInput').placeholder = isBili ? "粘贴 B 站链接或 BV 号，如 BV1SfpF6GEzC" : "本地视频：点击下方选择文件";
  $('drop').hidden = isBili;
  $('srcHint').textContent = isBili ? "优先抓取 B 站 CC 字幕；无字幕时自动转语音识别。" : "本地文件将使用语音识别转写。";
});

$('addBtn').addEventListener('click', startParse);
$('urlInput').addEventListener('keydown', function(e){ if(e.key==='Enter') startParse(); });
$('drop').addEventListener('click', function(){ startParse(true); });

function startParse(local){
  var src = local ? 'local' : state.src;
  var raw = $('urlInput').value.trim();
  var name;
  if(src==='bili'){
    if(!raw){ toast('请先粘贴 B 站链接或 BV 号'); return; }
    var m = raw.match(/BV[0-9A-Za-z]{10}/); name = (m?m[0]:'BVxxxxxxx') + ' · 新视频';
  }else{
    name = '本地视频_' + (state.videos.length+1) + '.mp4';
  }
  if(state.parsing){ toast('已有视频正在解析'); return; }
  $('urlInput').value='';
  startTask(src, name);
}

function startTask(src, name){
  state.parsing = {name:name, src:src, steps: STEP_DEFS.map(function(){return {pct:0,status:'pending'}}), cur:0};
  $('progressCard').hidden = false;
  $('pgName').textContent = name;
  renderProgress(0);
  var timer = setInterval(function(){
    var t = state.parsing; if(!t){ clearInterval(timer); return; }
    t.steps[t.cur].status = 'running';
    t.steps[t.cur].pct = Math.min(100, t.steps[t.cur].pct + 5 + Math.random()*7);
    var done = t.steps.every(function(s){return s.pct>=100});
    var total = Math.round(t.steps.reduce(function(a,s){return a+s.pct},0) / t.steps.length);
    renderProgress(total);
    if(done){ clearInterval(timer); finishTask(); }
    else if(t.steps[t.cur].pct>=100){ t.steps[t.cur].status='done'; t.cur = Math.min(STEP_DEFS.length-1, t.cur+1); }
  }, 520);
}

function finishTask(){
  var t = state.parsing;
  var chunks = Math.round(4 + Math.random()*18);
  state.videos.unshift({name:t.name, src:t.src==='bili'?'B站':'本地文件', chunks:chunks, time:'--:--:--'});
  state.parsing = null;
  toast('解析完成，已入库');
  setTimeout(function(){ $('progressCard').hidden = true; renderList(); }, 1400);
}

function renderProgress(total){
  $('pgPct').textContent = (total||0) + '%';
  $('pgBar').style.width = (total||0) + '%';
  var t = state.parsing; if(!t) return;
  var html = '';
  t.steps.forEach(function(s,i){
    var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>';
    html += '<div class="step '+s.status+'">'
      + '<div class="dot">'+(s.status==='done'?icon:'<span>'+(i+1)+'</span>')+'</div>'
      + '<span class="t">'+STEP_DEFS[i].t+'</span>'
      + '<span class="p">'+Math.round(s.pct)+'%</span></div>';
  });
  $('steps').innerHTML = html;
}

function renderList(){
  $('listWrap').hidden = state.videos.length===0;
  var play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 6v12l9-6z"/></svg>';
  $('vlist').innerHTML = state.videos.map(function(v){
    return '<div class="row"><span class="ic">'+play+'</span>'
      + '<div class="info"><div class="n">'+v.name+'</div><div class="s">'+v.src+' · '+v.time+' · '+v.chunks+' 片段</div></div>'
      + '<span class="badge">已入库</span></div>';
  }).join('');
}

function renderChat(){
  var c = $('chat');
  if(state.chat.length===0){
    c.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a8 8 0 01-8 8H5l-2 2V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg><div>开始提问，答案来自已入库视频</div></div>';
    return;
  }
  c.innerHTML = state.chat.map(function(m){
    if(m.role==='q') return '<div class="msg q">'+m.text+'</div>';
    var refs = m.refs ? '<div>'+m.refs.map(function(r){return '<span class="ts">'+r+'</span>'}).join('')+'</div>' : '';
    return '<div class="msg a"><div class="who">视知助手</div>'+m.text+refs+(m.caret?'<span class="caret"></span>':'')+'</div>';
  }).join('');
}
$('askBtn').addEventListener('click', ask);
$('askInput').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); } });

function ask(){
  if(state.asking) return;
  var q = $('askInput').value.trim();
  if(!q){ toast('请输入问题'); return; }
  $('askInput').value='';
  state.chat.push({role:'q', text:q});
  var msg = {role:'a', text:'', refs:['[344s-423s]'], caret:true};
  state.chat.push(msg);
  renderChat();
  state.asking = true;
  var full = '这是原型演示的模拟回答：我已从知识库检索到相关片段。（你的问题：“'+q+'”）';
  var i = 0;
  var timer = setInterval(function(){
    i += 3; msg.text = full.slice(0,i); msg.caret = i<full.length; renderChat();
    if(i>=full.length){ clearInterval(timer); msg.caret=false; state.asking=false; renderChat(); }
  }, 40);
}

var toastTimer;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){t.classList.remove('show')}, 2200);
}

renderList(); renderChat(); route();
</script>
</body>
</html>
